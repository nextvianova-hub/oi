<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowra Booking Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#F1EAFB;--surface:#FFFFFF;--surface-2:#FBF7FF;
    --lav-1:#C3AAF0;--lav-2:#8A63D2;--plum:#523A85;
    --pink:#F3C6E2;--pink-deep:#E48FC4;--text:#382B52;--soft:#8578A6;
    --gold:#E7C98F;--line:#E8DCF9;--shadow:0 10px 30px -12px rgba(82,58,133,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Poppins','Noto Sans Sinhala','Noto Sans Tamil','Noto Sans Devanagari','Noto Sans JP','Noto Sans KR',sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 500px at 15% -8%, #EAD9FB 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 10%, #FBDDEF 0%, transparent 50%), var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;min-height:100%;
  }
  .app{
    width:100%;max-width:440px;height:min(800px,calc(96vh - 34px));
    background:var(--surface);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 40px 90px -30px rgba(82,58,133,.55), 0 0 0 1px rgba(255,255,255,.6) inset;
  }

  /* header */
  .head{
    position:relative;z-index:5;padding:11px 14px 9px;flex:none;text-align:left;overflow:visible;
    background:
      radial-gradient(150px 100px at 8% -12%, rgba(243,183,223,.60), transparent 70%),
      radial-gradient(170px 120px at 96% 6%, rgba(180,143,221,.55), transparent 72%),
      linear-gradient(160deg,#FCEAF6 0%, #F3E5FB 52%, #ECE0FB 100%);
    border-bottom:1px solid var(--line);
  }
  .head .wm{position:absolute;right:-6px;top:-10px;width:110px;opacity:.13;pointer-events:none;transform:rotate(-6deg)}
  .home,.lang{
    position:absolute;top:13px;z-index:6;height:34px;border-radius:12px;
    border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.6);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--plum);transition:.18s
  }
  .home{left:13px;width:34px}
  .lang{right:13px;gap:5px;padding:0 9px;font:inherit;font-weight:600;font-size:12px}
  .home:hover,.lang:hover{background:#fff;transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(82,58,133,.5)}
  .home svg,.lang .globe{width:17px;height:17px}
  .lang .fl{font-size:15px;line-height:1}
  .brandlogo{position:relative;z-index:2;display:block;width:52%;max-width:196px;height:auto;
    margin:3px 0 1px 44px;filter:drop-shadow(0 6px 13px rgba(123,80,168,.16))}
  .nails{display:flex;gap:5px;margin-top:9px;position:relative}
  .nail{flex:1;height:12px;border-radius:8px 8px 4px 4px;background:#ECE1FA;
    box-shadow:0 0 0 1px #E2D3F6 inset;transition:background .5s ease, transform .35s ease;position:relative;overflow:hidden}
  .nail.on{background:linear-gradient(160deg,#F6B7DE 0%, #D8A0EE 55%, #B98FDD 100%);transform:translateY(-1px)}
  .nail.on::before{content:"";position:absolute;top:2px;left:3px;width:5px;height:7px;border-radius:5px;background:rgba(255,255,255,.85);filter:blur(.4px)}

  /* language menu */
  .langmenu{position:absolute;top:52px;right:13px;z-index:30;background:#fff;border:1px solid var(--line);
    border-radius:15px;box-shadow:0 22px 50px -18px rgba(82,58,133,.6);padding:6px;display:none;
    max-height:300px;overflow:auto;min-width:158px}
  .langmenu.open{display:block;animation:pop .2s ease both}
  .langitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;cursor:pointer;font-size:14px;color:var(--text)}
  .langitem:hover{background:var(--surface-2)}
  .langitem.cur{background:linear-gradient(140deg,#F6D6EC,#E4D3F8);color:var(--plum);font-weight:600}
  .langitem .fl{font-size:16px}

  /* chat */
  .chat{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:9px;
    background:linear-gradient(#FFFFFF, #FBF7FF);scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:7px}
  .chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  .row{display:flex;gap:9px;align-items:flex-end;max-width:100%}
  .row.bot{align-self:flex-start}
  .row.me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:33px;height:33px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:#F6EEFC;border:1px solid var(--line);overflow:hidden;box-shadow:0 5px 14px -8px rgba(82,58,133,.55)}
  .av img{width:26px;height:26px;object-fit:contain;display:block}
  .bubble{padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.5;max-width:268px;word-wrap:break-word;animation:pop .32s ease both}
  .bot .bubble{background:var(--surface);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 6px 18px -12px rgba(82,58,133,.4)}
  .me .bubble{background:linear-gradient(140deg,#8A63D2,#A87BE0);color:#fff;border-bottom-right-radius:6px;box-shadow:var(--shadow)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  .typing{display:flex;gap:4px;padding:13px 15px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--lav-1);animation:bob 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

  /* dock */
  .dock{flex:none;border-top:1px solid var(--line);background:var(--surface-2);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-height:66%;overflow-y:auto}
  .grouplabel{font-size:11.5px;font-weight:600;color:var(--lav-2);margin:3px 2px 5px;letter-spacing:.3px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--text);padding:7px 12px;border-radius:13px;
    font-size:12.5px;font-family:inherit;cursor:pointer;transition:.18s;font-weight:500}
  .chip:hover{border-color:var(--lav-1);transform:translateY(-1px)}
  .chip.sel{background:linear-gradient(140deg,#F6D6EC,#D9C2F5);border-color:var(--lav-1);color:var(--plum);box-shadow:0 6px 16px -10px rgba(138,99,210,.7)}
  .field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font-size:14px;
    font-family:inherit;color:var(--text);background:#fff;margin-bottom:8px;outline:none;transition:.18s}
  .field:focus{border-color:var(--lav-2);box-shadow:0 0 0 3px rgba(138,99,210,.15)}
  .flabel{font-size:12px;color:var(--soft);margin:2px 2px 5px;font-weight:500}
  .dtgrid{display:flex;gap:8px;margin-bottom:10px}
  .dtgrid .dt{margin-bottom:0;flex:1;min-width:0}
  input[type=date].field,input[type=time].field{-webkit-appearance:none;appearance:none}
  input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:sepia(1) hue-rotate(230deg) saturate(3);cursor:pointer;opacity:.7}
  textarea.field{resize:none;min-height:64px}
  .cta{width:100%;border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:11px;border-radius:14px;
    font-size:14px;color:#fff;letter-spacing:.3px;background:linear-gradient(135deg,#8A63D2,#B98FDD);
    box-shadow:0 10px 22px -12px rgba(138,99,210,.9);transition:.18s}
  .cta:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .cta:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .cta.ghost{background:none;color:var(--soft);box-shadow:none;font-weight:500;padding:9px}
  .cta.ghost:hover{color:var(--lav-2)}
  .btnrow{display:flex;gap:9px;align-items:center}
  .btnrow .cta{flex:1}.btnrow .cta.ghost{flex:none;width:auto}

  .summary{background:linear-gradient(160deg,#FFFFFF,#FBF4FF);border:1px solid var(--line);border-radius:20px;
    padding:18px 18px 6px;box-shadow:var(--shadow);animation:pop .4s ease both;max-width:300px}
  .summary h3{margin:0 0 3px;font-family:'Playfair Display',serif;color:var(--plum);font-size:18px;font-weight:600}
  .summary .sub{font-size:12px;color:var(--soft);margin:0 0 12px}
  .srow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .srow .k{color:var(--soft);flex:none}.srow .v{text-align:right;font-weight:500;color:var(--text)}
  .srow:first-of-type{border-top:none}
  .info{font-size:12px;color:var(--soft);line-height:1.6;padding:2px 4px}
  .info b{color:var(--lav-2)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .demo-note{margin:0;font-size:12px;color:#6E5C94;background:rgba(255,255,255,.7);padding:5px 12px;border-radius:999px;text-align:center}
</style>

</head>

jX5q2f9EvhARNTYy5ojM7RQRobGxMWd0dFTLiKhTxeD/F2Vf7IL8cf6gAAAAAElFTkSuQmCC";
  const NAILS=10;
  for(let i=0;i<NAILS;i++){const n=document.createElement('div');n.className='nail';nailsEl.appendChild(n);}
  const nailNodes=[...nailsEl.children];

  const STAFF=['Amaya','Chloe','Isuri','Lena','Maya','Sofia'];
  const A={}; let idx=0, answered=0;

  const steps=[
    {id:'service',kind:'multi',q:'welcome'},
    {id:'firstVisit',kind:'single',q:'q_first',opts:[{v:'first_yes',k:'first_yes'},{v:'first_no',k:'first_no'}]},
    {id:'current',kind:'single',q:'q_current',opts:[{v:'yes',k:'yes'},{v:'no',k:'no'}]},
    {id:'currentType',kind:'single',q:'q_type',opts:['Gel','Polish'],skip:()=>A.current!=='yes'},
    {id:'gelSource',kind:'single',q:'q_source',opts:[{v:'src_ours',k:'src_ours'},{v:'src_other',k:'src_other'}],skip:()=>A.currentType!=='Gel'},
    {id:'design',kind:'single',q:'q_design',opts:['One Color','Magnet','Glitter Gradation','French','Art Design',{v:'undecided',k:'d_undecided'}]},
    {id:'datetime',kind:'datetime',q:'q_datetime'},
    {id:'staff',kind:'single',q:'q_staff',opts:[{v:'no_pref',k:'no_pref'},...STAFF]},
    {id:'name',kind:'text',q:'q_name',ph:'ph_name'},
    {id:'phone',kind:'tel',q:'q_phone',ph:'ph_phone'},
    {id:'referrer',kind:'single',q:'q_referrer',opts:[{v:'no',k:'no'},{v:'yes',k:'yes'}]},
    {id:'referrerName',kind:'text',q:'q_refname',ph:'ph_refname',skip:()=>A.referrer!=='yes'},
    {id:'allergies',kind:'textarea',q:'q_allergies',ph:'ph_allergies'}
  ];

  function scroll(){chat.scrollTop=chat.scrollHeight;}
  function botBubble(html){const r=document.createElement('div');r.className='row bot';
    r.innerHTML='<div class="av"><img src="'+MARK+'" alt=""></div><div class="bubble">'+html+'</div>';chat.appendChild(r);scroll();}
  function meBubble(txt){const r=document.createElement('div');r.className='row me';
    r.innerHTML='<div class="bubble">'+txt+'</div>';chat.appendChild(r);scroll();}
  function typing(cb){const r=document.createElement('div');r.className='row bot';
    r.innerHTML='<div class="av"><img src="'+MARK+'" alt=""></div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
    chat.appendChild(r);scroll();setTimeout(()=>{r.remove();cb();},520);}
  function paint(){const target=Math.min(NAILS,Math.ceil(answered/13*NAILS));nailNodes.forEach((n,i)=>n.classList.toggle('on',i<target));}

  function next(){idx++;while(idx<steps.length && steps[idx].skip && steps[idx].skip()) idx++;
    if(idx>=steps.length){finish();return;} ask();}
  function ask(){const s=steps[idx];typing(()=>{botBubble(t(s.q));render(s);});}
  function commit(display,save){meBubble(display);Object.assign(A,save);answered++;paint();dock.innerHTML='';next();}

  function render(s){dock.innerHTML='';
    if(s.kind==='single')return renderSingle(s);
    if(s.kind==='multi')return renderMulti(s);
    if(s.kind==='datetime')return renderDatetime(s);
    if(s.kind==='textarea')return renderTextarea(s);
    return renderText(s);}

  function renderSingle(s){
    const wrap=document.createElement('div');wrap.className='chips';
    s.opts.forEach(o=>{
      const disp=(typeof o==='string')?o:t(o.k);
      const canon=(typeof o==='string')?o:o.v;
      const b=document.createElement('button');b.className='chip';b.textContent=disp;
      b.onclick=()=>commit(disp,{[s.id]:canon,[s.id+'_d']:disp});
      wrap.appendChild(b);
    });
    dock.appendChild(wrap);
  }

  function renderMulti(s){
    const chosen=new Set();
    const groups=[
      {tag:'Hand',label:t('grp_hand'),opts:['Gel Color','Polish Color','Quick Manicure','Signature Manicure']},
      {tag:'Foot',label:t('grp_foot'),opts:['Gel Color','Polish Color','Quick Pedicure','Signature Pedicure',t('callus')]}
    ];
    groups.forEach(g=>{
      const lab=document.createElement('div');lab.className='grouplabel';lab.textContent=g.label;dock.appendChild(lab);
      const wrap=document.createElement('div');wrap.className='chips';
      g.opts.forEach(opt=>{
        const val=opt+' ('+g.tag+')';
        const b=document.createElement('button');b.className='chip';b.textContent=opt;
        b.onclick=()=>{if(chosen.has(val)){chosen.delete(val);b.classList.remove('sel');}
          else{chosen.add(val);b.classList.add('sel');} go.disabled=chosen.size===0;};
        wrap.appendChild(b);
      });
      dock.appendChild(wrap);
    });
    const go=document.createElement('button');go.className='cta';go.textContent=t('btn_next');go.disabled=true;go.style.marginTop='6px';
    go.onclick=()=>{const arr=[...chosen];commit(arr.join(', '),{service:arr});};
    dock.appendChild(go);
  }

  function renderText(s){
    const f=document.createElement('input');f.className='field';f.type=(s.kind==='tel')?'tel':'text';f.placeholder=t(s.ph)||'';
    const btn=document.createElement('button');btn.className='cta';btn.textContent=t('btn_send');
    const submit=()=>{const v=f.value.trim();if(!v){f.focus();return;}commit(v,{[s.id]:v});};
    btn.onclick=submit;f.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
    dock.appendChild(f);dock.appendChild(btn);setTimeout(()=>f.focus(),80);
  }

  function renderTextarea(s){
    const f=document.createElement('textarea');f.className='field';f.placeholder=t(s.ph)||'';
    const row=document.createElement('div');row.className='btnrow';
    const send=document.createElement('button');send.className='cta';send.textContent=t('btn_send');
    const skip=document.createElement('button');skip.className='cta ghost';skip.textContent=t('btn_skip');
    send.onclick=()=>{const v=f.value.trim();commit(v||'—',{[s.id]:v});};
    skip.onclick=()=>commit('—',{[s.id]:''});
    row.appendChild(send);row.appendChild(skip);dock.appendChild(f);dock.appendChild(row);setTimeout(()=>f.focus(),80);
  }

  function fmtDT(dv,tv){
    if(!dv)return '';
    const p=dv.split('-').map(Number),M=p[1],D=p[2];
    let d;
    if(lang==='ja')d=M+'月'+D+'日';
    else if(lang==='ko')d=M+'월 '+D+'일';
    else d=t('months')[M-1]+' '+D;
    if(tv){let tp=tv.split(':').map(Number),hh=tp[0],mm=tp[1];
      const ap=hh<12?t('am'):t('pm');let h12=hh%12||12;
      d+=', '+h12+':'+String(mm).padStart(2,'0')+' '+ap;}
    return d;
  }
  function renderDatetime(s){
    const today=new Date().toLocaleDateString('en-CA');
    function pair(txt){
      const lab=document.createElement('div');lab.className='flabel';lab.textContent=txt;
      const g=document.createElement('div');g.className='dtgrid';
      const d=document.createElement('input');d.className='field dt';d.type='date';d.min=today;
      const tm=document.createElement('input');tm.className='field dt';tm.type='time';
      g.appendChild(d);g.appendChild(tm);return {lab,g,d,tm};
    }
    const p1=pair(t('lbl_first')),p2=pair(t('lbl_second'));
    const btn=document.createElement('button');btn.className='cta';btn.textContent=t('btn_next');
    btn.onclick=()=>{if(!p1.d.value){p1.d.focus();return;}
      const a=fmtDT(p1.d.value,p1.tm.value),b=fmtDT(p2.d.value,p2.tm.value);
      commit('1) '+a+(b?'   ·   2) '+b:''),{dt1:a,dt2:b||'—'});};
    dock.appendChild(p1.lab);dock.appendChild(p1.g);dock.appendChild(p2.lab);dock.appendChild(p2.g);dock.appendChild(btn);
  }

  function row(k,v){return v?'<div class="srow"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>':'';}
  function summaryCard(){
    const off=A.current==='yes'?t('off_yes'):t('off_no');
    return '<div class="summary"><h3>'+t('s_title')+'</h3><p class="sub">'+t('s_sub')+'</p>'+
      row(t('s_service'),(A.service||[]).join(', '))+
      row(t('s_design'),A.design_d)+
      row(t('s_off'),off)+
      row(t('s_first'),A.firstVisit_d)+
      row(t('s_datetime'),A.dt1+(A.dt2&&A.dt2!=='—'?' · '+A.dt2:''))+
      row(t('s_staff'),A.staff_d)+
      row(t('s_name'),A.name)+
      row(t('s_phone'),A.phone)+
      row(t('s_ref'),A.referrerName)+
      row(t('s_care'),(A.allergies&&A.allergies!=='—')?A.allergies:'')+
      '</div>';
  }
  function finish(){
    typing(()=>{
      botBubble(t('fin_thanks'));
      const card=document.createElement('div');card.className='row bot';
      card.innerHTML='<div class="av"><img src="'+MARK+'" alt=""></div>'+summaryCard();
      chat.appendChild(card);nailNodes.forEach(n=>n.classList.add('on'));scroll();
      typing(()=>{
        botBubble(t('fin_confirm'));dock.innerHTML='';
        const info=document.createElement('div');info.className='info';info.innerHTML=t('fin_info');dock.appendChild(info);
        const again=document.createElement('button');again.className='cta ghost';again.textContent=t('btn_new');
        again.style.marginTop='6px';again.style.width='100%';again.onclick=restart;dock.appendChild(again);scroll();
      });
    });
  }

  function restart(){chat.innerHTML='';dock.innerHTML='';Object.keys(A).forEach(k=>delete A[k]);idx=0;answered=0;paint();ask();}

  /* language menu */
  function buildMenu(){
    langMenu.innerHTML='';
    LANGS.forEach(function(item){
      const c=item[0],nm=item[1],fl=item[2];
      const it=document.createElement('div');it.className='langitem'+(c===lang?' cur':'');
      it.innerHTML='<span class="fl">'+fl+'</span>'+nm;
      it.onclick=function(){lang=c;langFlag.textContent=fl;langMenu.classList.remove('open');buildMenu();restart();};
      langMenu.appendChild(it);
    });
  }
  langBtn.onclick=function(e){e.stopPropagation();langMenu.classList.toggle('open');};
  document.addEventListener('click',function(){langMenu.classList.remove('open');});
  homeBtn.onclick=restart;
  buildMenu();

  /* boot */
  ask();
})();
</script>
